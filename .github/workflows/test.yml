name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group lint
      - run: ruff check
      - run: ruff format --check
      - run: mypy

  # The site is built with warnings as errors: a broken link, a reference to a name that
  # does not exist or a page outside every table of contents fails the job. It is built
  # by the script that publishes it (docs.yml), from this commit alone: this clone holds
  # no other branch and no tag, so no other version is built.
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python .github/scripts/build-docs-site.py --output _site --development HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: _site/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group test
      - run: pytest
