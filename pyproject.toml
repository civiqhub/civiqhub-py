[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "civiqhub"
dynamic = ["version"]
description = "Python package by CiviqHub. Preview, not functional yet."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CiviqHub", email = "contact@civiqhub.com" }]
keywords = ["civiqhub", "collective decision"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Sociology",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://civiqhub.com"
Documentation = "https://civiqhub.github.io/civiqhub-py/"
Source = "https://github.com/civiqhub/civiqhub-py"
Issues = "https://github.com/civiqhub/civiqhub-py/issues"

[dependency-groups]
test = ["pytest>=9.1"]
# mypy also checks the tests, so it needs pytest.
lint = [{ include-group = "test" }, "ruff==0.17.2", "mypy==2.4.0"]
dev = [{ include-group = "lint" }, "build>=1.6", "twine>=7.0"]
# The documentation site (docs/). Sphinx 9 needs Python 3.13, so this group stays out of
# dev. Sphinx and sphinxcontrib-mermaid are BSD-2-Clause; MyST-Parser and Furo are MIT.
docs = [
  "sphinx==9.2.0",
  "myst-parser==5.2.0",
  "furo==2025.12.19",
  "sphinxcontrib-mermaid==2.1.1",
]

[tool.hatch.version]
path = "src/civiqhub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/civiqhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["engine: tests that need civiqhub-selene"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# The release script belongs to the publication chain, which this change does not touch.
extend-exclude = [".github/scripts/check-version.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", ".github/scripts/build-docs-site.py"]
