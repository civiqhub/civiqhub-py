[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "civiqhub"
dynamic = ["version"]
description = "Python package by CiviqHub. Preview, not functional yet."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CiviqHub", email = "contact@civiqhub.com" }]
keywords = ["civiqhub", "collective decision"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Sociology",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://civiqhub.com"
Source = "https://github.com/civiqhub/civiqhub-py"
Issues = "https://github.com/civiqhub/civiqhub-py/issues"

[tool.hatch.version]
path = "src/civiqhub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/civiqhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".github"]  # release tooling, left as it is on this branch

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/civiqhub", "tests"]

# The analysis engine and NumPy are optional: type checking works without them.
[[tool.mypy.overrides]]
module = ["civiqhub_selene", "civiqhub_selene.*", "numpy", "numpy.*"]
ignore_missing_imports = true

# Without the engine its types are unknown, so what the bridge returns from it
# cannot be checked. With the engine installed these modules pass in full strict mode.
[[tool.mypy.overrides]]
module = ["civiqhub.citation", "civiqhub.analysis"]
warn_return_any = false
